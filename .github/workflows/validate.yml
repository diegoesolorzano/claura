name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: macos-latest    # 0.1.0 is macOS-only
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Install shellcheck
        run: brew install shellcheck

      # hooks.json carries Grok-only events (StopCancelled) that Claude Code does not know,
      # so --strict would reject a deliberate entry. Stay strict for every other warning.
      - name: claude plugin validate (strict, except Grok-only hook events)
        run: |
          out=$(claude plugin validate . 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          total=$(echo "$out" | grep -oE 'Found [0-9]+ warning' | grep -oE '[0-9]+' | head -1 || true)
          tolerated=$(echo "$out" | grep -cE 'hooks\.StopCancelled: unknown hook event' || true)
          if [ "${total:-0}" -gt "${tolerated:-0}" ]; then
            echo "::error::unexpected plugin validation warnings (${total} found, ${tolerated} tolerated)"
            exit 1
          fi

      - name: bash -n on every script
        run: bash -n bin/*.sh

      - name: shellcheck (blocking)
        run: shellcheck -s bash bin/*.sh

      - name: unit tests
        run: bash tests/run.sh

      - name: Smoke — CLAUDE_PLUGIN_ROOT with a space
        run: |
          mkdir -p "/tmp/has space/claura"
          cp -R . "/tmp/has space/claura/"
          CLAUDE_PLUGIN_ROOT="/tmp/has space/claura" \
            bash -n "/tmp/has space/claura/bin/claura-control.sh"
          CLAUDE_PLUGIN_ROOT="/tmp/has space/claura" \
            bash -n "/tmp/has space/claura/bin/claura-player.sh"
          CLAUDE_PLUGIN_ROOT="/tmp/has space/claura" \
            bash -n "/tmp/has space/claura/bin/claura-cli.sh"
